import java.util.Properties

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.github.megatronking.stringfog:gradle-plugin:5.2.0'
        classpath 'com.github.megatronking.stringfog:xor:5.0.0'
    }
}

plugins {
    alias(libs.plugins.android.application)
}

apply plugin: 'stringfog'

import com.github.megatronking.stringfog.plugin.kg.RandomKeyGenerator
import com.github.megatronking.stringfog.plugin.StringFogMode

android {
    namespace 'zig.cheat.qq'
    compileSdk 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'zig.cheat.qq'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"
        ndk { abiFilters "arm64-v8a" }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '4.1.2'
        }
    }

    signingConfigs {
        release {
            def envFile = rootProject.file('.env')
            def env = new Properties()
            if (envFile.exists()) {
                env.load(new FileInputStream(envFile))
            }

            storeFile file(env.RELEASE_STORE_FILE ?: "real.jks")
            storePassword "123456"
            keyAlias "terrariamodify"
            keyPassword "123456"

            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildFeatures {
        viewBinding false
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

stringfog {
    implementation 'com.github.megatronking.stringfog.xor.StringFogImpl'
    enable true
    fogPackages = ['zig.cheat.qq']
    kg new RandomKeyGenerator()
    mode StringFogMode.base64
}

dependencies {
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.megatronking.stringfog:xor:5.0.0'
}